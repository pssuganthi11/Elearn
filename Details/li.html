<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><li> Tag Details</title>
</head>
<body>
    <h1>&lt;li&gt; Tag Details</h1>
    <p>The <code>&lt;li&gt;</code> tag defines an item in a list.</p>

    <h3>Example:</h3>
    <pre><code>&lt;ul&gt;
    &lt;li&gt;Item&lt;/li&gt;
&lt;/ul&gt;</code></pre>
</body>
</html>
