<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tag Details</title>
</head>
<body>
    <h1>&lt;script&gt; Tag Details</h1>
    <p>The <code>&lt;script&gt;</code> tag is used to add JavaScript inside an HTML document.</p>

    <h3>Example:</h3>
    <pre><code>&lt;script&gt;
    console.log("Hello!");
&lt;/script&gt;</code></pre>
</body>
</html>
