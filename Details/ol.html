<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><ol> Tag Details</title>
</head>
<body>
    <h1>&lt;ol&gt; Tag Details</h1>
    <p>The <code>&lt;ol&gt;</code> tag defines an ordered (numbered) list.</p>

    <h3>Example:</h3>
    <pre><code>&lt;ol&gt;
    &lt;li&gt;First Item&lt;/li&gt;
&lt;/ol&gt;</code></pre>
</body>
</html>
