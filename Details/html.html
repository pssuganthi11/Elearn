<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>&lt;html&gt; Tag Details</title>

    <style>
        body { font-family: Arial; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .left, .right { width: 50%; }
        pre { background:#f4f4f4; padding:10px; border-radius:8px; }
        .output-box { border:1px solid #ccc; padding:15px; border-radius:10px; }
    </style>
</head>
<body>

<div class="container">

    <div class="left">
        <h1>&lt;html&gt; Tag Details</h1>
        <p>The <code>&lt;html&gt;</code> tag is the root element of every HTML document.</p>

        <h3>Example Code:</h3>
        <pre><code>&lt;html&gt;
    &lt;head&gt;&lt;/head&gt;
    &lt;body&gt;&lt;/body&gt;
&lt;/html&gt;</code></pre>
    </div>

    <div class="right">
        <h3>Example Output:</h3>
        <div class="output-box">
            (Root element – not visible in browser)
        </div>
    </div>

</div>

</body>
</html>
