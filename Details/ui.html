<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><ul> Tag Details</title>
</head>
<body>
    <h1>&lt;ul&gt; Tag Details</h1>
    <p>The <code>&lt;ul&gt;</code> tag defines an unordered (bulleted) list.</p>

    <h3>Example:</h3>
    <pre><code>&lt;ul&gt;
    &lt;li&gt;Item 1&lt;/li&gt;
&lt;/ul&gt;</code></pre>
</body>
</html>
