<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>&lt;head&gt; Tag Details</title>

    <style>
        body { font-family: Arial; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .left, .right { width: 50%; }
        pre { background:#f4f4f4; padding:10px; border-radius:8px; }
        .output-box { border:1px solid #ccc; padding:15px; border-radius:10px; }
    </style>
</head>
<body>

<div class="container">

    <div class="left">
        <h1>&lt;head&gt; Tag Details</h1>
        <p>Contains metadata such as title, styles, scripts, links and SEO information.</p>

        <h3>Example Code:</h3>
        <pre><code>&lt;head&gt;
    &lt;title&gt;My Page&lt;/title&gt;
&lt;/head&gt;</code></pre>
    </div>

    <div class="right">
        <h3>Example Output:</h3>
        <div class="output-box">
            (Metadata – not directly visible to users)
        </div>
    </div>

</div>

</body>
</html>
