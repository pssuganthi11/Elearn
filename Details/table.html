<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><table> Tag Details</title>
</head>
<body>
    <h1>&lt;table&gt; Tag Details</h1>
    <p>The <code>&lt;table&gt;</code> tag is used to create a table consisting of rows and columns.</p>

    <h3>Example:</h3>
    <pre><code>&lt;table&gt;
    &lt;tr&gt;
        &lt;td&gt;Data&lt;/td&gt;
    &lt;/tr&gt;
&lt;/table&gt;</code></pre>
</body>
</html>
