<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>&lt;p&gt; Tag Details</title>

    <style>
        body { font-family: Arial; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .left, .right { width: 50%; }
        pre { background:#f4f4f4; padding:10px; border-radius:8px; }
        .output-box { border:1px solid #ccc; padding:15px; border-radius:10px; }
    </style>
</head>
<body>

<div class="container">

    <div class="left">
        <h1>&lt;p&gt; Tag Details</h1>
        <p>The paragraph tag defines a block of text.</p>

        <h3>Example Code:</h3>
        <pre><code>&lt;p&gt;This is a paragraph.&lt;/p&gt;</code></pre>
    </div>

    <div class="right">
        <h3>Example Output:</h3>
        <div class="output-box">
            <p>This is a paragraph.</p>
        </div>
    </div>

</div>

</body>
</html>
