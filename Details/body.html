<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>&lt;body&gt; Tag Details</title>

    <style>
        body { font-family: Arial; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .left, .right { width: 50%; }
        pre { background:#f4f4f4; padding:10px; border-radius:8px; }
        .output-box { border:1px solid #ccc; padding:15px; border-radius:10px; }
    </style>
</head>
<body>

<div class="container">

    <div class="left">
        <h1>&lt;body&gt; Tag Details</h1>
        <p>The <code>&lt;body&gt;</code> tag contains all visible content of the webpage.</p>

        <h3>Example Code:</h3>
        <pre><code>&lt;body&gt;
    &lt;h1&gt;Hello World&lt;/h1&gt;
    &lt;p&gt;This is my page.&lt;/p&gt;
&lt;/body&gt;</code></pre>
    </div>

    <div class="right">
        <h3>Example Output:</h3>
        <div class="output-box">
            <h1>Hello World</h1>
            <p>This is my page.</p>
        </div>
    </div>

</div>

</body>
</html>
