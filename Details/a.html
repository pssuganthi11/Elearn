<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>&lt;a&gt; Tag Details</title>

    <style>
        body { font-family: Arial; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .left, .right { width: 50%; }
        pre { background:#f4f4f4; padding:10px; border-radius:8px; }
        .output-box { border:1px solid #ccc; padding:15px; border-radius:10px; }
        a { color: blue; }
    </style>
</head>
<body>

<div class="container">

    <div class="left">
        <h1>&lt;a&gt; Tag Details</h1>
        <p>The anchor tag creates clickable links.</p>

        <h3>Main Attributes:</h3>
        <ul>
            <li><code>href</code> – link URL</li>
            <li><code>target="_blank"</code> – open in new tab</li>
            <li><code>download</code> – download file</li>
        </ul>

        <h3>Example Code:</h3>
        <pre><code>&lt;a href="https://google.com" target="_blank"&gt;Visit Google&lt;/a&gt;</code></pre>
    </div>

    <div class="right">
        <h3>Example Output:</h3>
        <div class="output-box">
            <a href="https://google.com" target="_blank">Visit Google</a>
        </div>
    </div>

</div>

</body>
</html>
